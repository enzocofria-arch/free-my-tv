name: Build APK

on:
  workflow_dispatch:
    inputs:
      city:
        description: "Nome da cidade"
        default: "Cacimba de Dentro"
      latitude:
        description: "Latitude"
        default: "-6.6433"
      longitude:
        description: "Longitude"
        default: "-35.7797"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Configuracao
        env:
          CITY: ${{ inputs.city }}
          LAT_IN: ${{ inputs.latitude }}
          LON_IN: ${{ inputs.longitude }}
          TMDB: ${{ secrets.TMDB_KEY }}
        run: |
          LAT=$(printf '%s' "$LAT_IN" | tr ',' '.' | tr -cd '0-9.-')
          LON=$(printf '%s' "$LON_IN" | tr ',' '.' | tr -cd '0-9.-')
          cp config.example.properties config.properties
          sed -i \
            -e "s|^tmdb_key=.*|tmdb_key=${TMDB}|" \
            -e "s|^tmdb_region=.*|tmdb_region=BR|" \
            -e "s|^latitude=.*|latitude=${LAT}|" \
            -e "s|^longitude=.*|longitude=${LON}|" \
            -e "s|^city=.*|city=${CITY}|" \
            -e "s|^language=.*|language=pt|" \
            -e "s|^currency=.*|currency=BRL|" \
            -e "s|^temperature=.*|temperature=C|" \
            config.properties
      - name: Compilar
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-apk
          path: FreeMyTV.apk
