name: Build APK

on:
  workflow_dispatch:
    inputs:
      city:
        description: "Nome da cidade"
        default: "Fortaleza"
      latitude:
        description: "Latitude"
        default: "-3.7319"
      longitude:
        description: "Longitude"
        default: "-38.5267"
      tmdb_key:
        description: "Chave do TMDB (opcional)"
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/sdk" \
            "build-tools;34.0.0" "platforms;android-34" > /dev/null
          echo "ANDROID_HOME=$RUNNER_TEMP/sdk" >> "$GITHUB_ENV"
      - name: Configuracao
        env:
          CITY: ${{ inputs.city }}
          LAT: ${{ inputs.latitude }}
          LON: ${{ inputs.longitude }}
          TMDB: ${{ inputs.tmdb_key }}
        run: |
          cp config.example.properties config.properties
          sed -i \
            -e "s|^tmdb_key=.*|tmdb_key=${TMDB}|" \
            -e "s|^tmdb_region=.*|tmdb_region=BR|" \
            -e "s|^latitude=.*|latitude=${LAT}|" \
            -e "s|^longitude=.*|longitude=${LON}|" \
            -e "s|^city=.*|city=${CITY}|" \
            -e "s|^language=.*|language=pt|" \
            -e "s|^currency=.*|currency=BRL|" \
            -e "s|^temperature=.*|temperature=C|" \
            config.properties
      - name: Compilar
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: FreeMyTV-apk
          path: FreeMyTV.apk
